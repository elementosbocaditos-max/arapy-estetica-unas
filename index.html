<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Maison de Beauté — Uñas & Peluquería</title>
    <meta name="description" content="App de reservas de turnos y gestión para salón de estética de uñas y peluquería." />
    <meta name="theme-color" content="#c59b27" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Beauty Studio" />
    <link rel="manifest" href="./manifest.json" />
    
    <!-- Fuentes Google Fonts de Perfumería Francesa y Alta Costura -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600;1,700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    
    <!-- Hoja de Estilos con Cache-Buster v4.3 -->
    <link rel="stylesheet" href="./css/app.css?v=4.3" />
  </head>
  <body>
    <div id="app-root">
      <!-- Pantalla de bienvenida instantánea mientras carga la app -->
      <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; background: #faf7f2; color: #c59b27; font-family: 'Playfair Display', serif; text-align: center; padding: 20px;">
        <div style="width: 44px; height: 44px; border: 2.5px solid rgba(197, 155, 39, 0.2); border-top-color: #c59b27; border-radius: 50%; animation: spinMaison 0.8s linear infinite; margin-bottom: 14px;"></div>
        <h2 style="font-size: 19px; font-weight: 600; letter-spacing: 0.15em; text-transform: uppercase; margin: 0 0 6px; color: #1a1917;">Maison de Beauté</h2>
        <p style="font-size: 11px; color: #8e8070; letter-spacing: 0.08em; text-transform: uppercase; margin: 0;">Iniciando tu salón de belleza...</p>
        <style>@keyframes spinMaison { to { transform: rotate(360deg); } }</style>
      </div>
    </div>

    <!-- Script Principal con Cache-Buster v4.3 -->
    <script type="module" src="./js/app.js?v=4.3"></script>

    <!-- Registro y Auto-Actualización de Service Worker PWA -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js?v=4.3').then(
            (reg) => {
              console.log('✅ [PWA] Service Worker activo:', reg.scope);
              reg.update();
            },
            (err) => console.log('⚠️ [PWA] Service Worker:', err)
          );
        });
      }
    </script>
  </body>
</html>
