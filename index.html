<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Beauty & Nail Studio</title>
    <meta name="description" content="App de reservas de turnos y gestión para salón de estética de uñas y peluquería." />
    <meta name="theme-color" content="#d67479" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Beauty Studio" />
    <link rel="manifest" href="./manifest.json" />
    
    <!-- Fuentes Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    
    <!-- Hoja de Estilos -->
    <link rel="stylesheet" href="./css/app.css" />
  </head>
  <body>
    <div id="app-root">
      <!-- El contenido se renderiza dinámicamente mediante js/app.js -->
    </div>

    <!-- Script Principal -->
    <script type="module" src="./js/app.js"></script>

    <!-- Registro de Service Worker PWA -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js').then(
            (reg) => console.log('✅ [PWA] Service Worker registrado con éxito:', reg.scope),
            (err) => console.log('⚠️ [PWA] Error registrando Service Worker:', err)
          );
        });
      }
    </script>
  </body>
</html>
